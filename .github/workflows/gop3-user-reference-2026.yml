name: Inspect GOP3 user reference video Windows 2026
on:
  push:
    branches: [gada-poker-windows]
    paths:
      - .github/workflows/gop3-user-reference-2026.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  video-review:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install inspection tools
        shell: pwsh
        run: |
          python -m pip install --upgrade "yt-dlp[default,curl-cffi]" playwright
      - name: Retrieve user-supplied reference video via public URL
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path media-review | Out-Null
          $url='https://www.youtube.com/watch?v=Mb-f1NLv1EM'
          $variants=@(
             @('--js-runtimes','node','--impersonate','chrome','--extractor-args','youtube:player_client=mweb','--no-playlist','-f','best[height<=480]/best','-o','media-review/yt_video.%(ext)s',$url),
             @('--js-runtimes','node','--extractor-args','youtube:player_client=android_vr,tv','--no-playlist','-f','best[height<=480]/best','-o','media-review/yt_video.%(ext)s',$url)
          )
          for ($i=0; $i -lt $variants.Count; $i++) {
            Write-Host "Downloading attempt $i"
            & python -m yt_dlp @($variants[$i]) *> "media-review/yt-dlp-$i.txt"
            if (Get-ChildItem media-review -File | Where-Object {$_.Extension -in @('.mp4','.webm','.mkv')}) { Write-Host 'Video downloaded'; break }
          }
      - name: Open exact video in real Windows Chrome and extract visible video frames
        shell: pwsh
        continue-on-error: true
        run: |
          @'
          from pathlib import Path
          import asyncio, json
          from playwright.async_api import async_playwright
          async def main():
            out=Path("media-review")
            async with async_playwright() as p:
              b=await p.chromium.launch(channel="chrome",headless=True,args=["--autoplay-policy=no-user-gesture-required"])
              page=await b.new_page(viewport={"width":1366,"height":768})
              urls=['https://www.youtube.com/watch?v=Mb-f1NLv1EM','https://www.youtube-nocookie.com/embed/Mb-f1NLv1EM?autoplay=1','https://www.youtube.com/embed/Mb-f1NLv1EM?autoplay=1']
              for j,u in enumerate(urls):
                try:
                  await page.goto(u,wait_until="domcontentloaded",timeout=35000)
                  await page.wait_for_timeout(3500)
                  await page.screenshot(path=str(out/f"chrome_{j}_a.png"))
                  for sel in ["button:has-text('Accept all')","button:has-text('I agree')",".ytp-large-play-button"]:
                    try: await page.locator(sel).first.click(timeout=2000)
                    except: pass
                  await page.wait_for_timeout(5000)
                  await page.screenshot(path=str(out/f"chrome_{j}_b.png"))
                  state=await page.evaluate("""() => {
                    let v=document.querySelector("video");return {title:document.title,text:document.body?.innerText?.slice(0,3000),video:v?{currentTime:v.currentTime,duration:v.duration,videoWidth:v.videoWidth,videoHeight:v.videoHeight,paused:v.paused,error:v.error?.message}:null}
                  }""")
                  (out/f"chrome_{j}_state.json").write_text(json.dumps(state,ensure_ascii=False,indent=2),encoding='utf-8')
                except Exception as e:
                  (out/f"chrome_{j}_error.txt").write_text(repr(e),encoding='utf-8')
              await b.close()
          asyncio.run(main())
          '@ | Set-Content -Encoding UTF8 media_browser.py
          python media_browser.py
      - name: Save video metadata and keyframes if obtained
        shell: pwsh
        continue-on-error: true
        run: |
          $f=Get-ChildItem media-review -File | Where-Object {$_.Extension -in @('.mp4','.webm','.mkv')} | Select-Object -First 1
          if ($f) {
            $file=$f.FullName
            ffprobe -v error -show_entries format=duration,format_name,size -of default=noprint_wrappers=1 $file | Out-File -Encoding utf8 media-review/video_metadata.txt
            ffmpeg -y -hide_banner -loglevel error -i $file -vf "fps=1/12,scale=800:-1" -frames:v 40 media-review/ref_%03d.jpg
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gop3-windows-youtube-user-reference
          path: media-review/
          retention-days: 1

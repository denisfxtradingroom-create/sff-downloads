name: Inspect YouTube Short in real Windows Chrome
on:
  push:
    branches: [gada-poker-windows]
    paths:
      - .github/workflows/inspect-browser-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install browser automation
        shell: pwsh
        run: python -m pip install playwright
      - name: Open video in Windows Google Chrome
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force video-browser | Out-Null
          @'
          from pathlib import Path
          import asyncio, json
          from playwright.async_api import async_playwright
          VIDEO = 'https://www.youtube.com/watch?v=zuuEQqSuYBY'
          async def main():
              dest = Path("video-browser")
              async with async_playwright() as p:
                  browser = await p.chromium.launch(channel="chrome", headless=True, args=["--autoplay-policy=no-user-gesture-required"])
                  page = await browser.new_page(viewport={"width":1280,"height":900}, locale="en-US")
                  try:
                      await page.goto(VIDEO, wait_until="domcontentloaded", timeout=45000)
                  except Exception as e:
                      (dest/"navigation_error.txt").write_text(str(e),encoding="utf-8")
                  for i in range(3):
                      await page.wait_for_timeout(3000)
                      if i == 0:
                          try:
                              await page.locator("button:has-text('Accept all')").first.click(timeout=1500)
                          except Exception:
                              pass
                      try:
                          video = await page.evaluate("""() => {
                            const v=document.querySelector('video');
                            return v?{readyState:v.readyState,currentTime:v.currentTime,duration:v.duration,paused:v.paused,videoWidth:v.videoWidth,videoHeight:v.videoHeight,error:v.error?.message||null}:null;
                          }""")
                          (dest/f"state_{i}.json").write_text(json.dumps({"title":await page.title(),"url":page.url,"video":video, "text":(await page.locator("body").inner_text())[:1600]},ensure_ascii=False,indent=2),encoding="utf-8")
                          await page.screenshot(path=str(dest/f"screen_{i}.png"))
                      except Exception as e:
                          (dest/f"error_{i}.txt").write_text(str(e),encoding="utf-8")
                  await browser.close()
          asyncio.run(main())
          '@ | Set-Content -Encoding UTF8 video_browser.py
          python video_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-browser-youtube-zuuEQqSuYBY
          path: video-browser/
          retention-days: 1

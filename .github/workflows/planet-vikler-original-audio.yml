name: Planet Vikler Original Audio offline Android
on:
  push:
    branches: [planet-vikler-original-audio-offline]
  workflow_dispatch:

jobs:
  native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK and native toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-33" "build-tools;33.0.2" "cmake;3.22.1" "ndk;25.2.9519653"
      - name: Clone native Android pinball engine and CC0 table
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch android --recurse-submodules --shallow-submodules https://github.com/fexed/Pinball-on-Android.git port
          git clone --depth=1 https://github.com/andrewnakas/open-cadet.git open-cadet
          test -f port/SpaceCadetPinball/Sound.cpp
          test -s port/app/src/main/assets/PINBALL.mp3
          test -s open-cadet/PINBALL.DAT
      - name: Assemble original audio with original physics and working game table
        shell: bash
        run: |
          set -euo pipefail
          python3 planet-vikler/prepare_original_audio.py
          test ! -e port/app/src/main/assets/FONT.DAT
          test ! -e port/app/src/main/assets/table.bmp
          python3 - <<'PY'
          from pathlib import Path
          src=Path("upstream_audio_cache")
          dst=Path("port/app/src/main/assets")
          sound_files=list(src.glob("SOUND*.WAV"))
          assert len(sound_files)>=60, len(sound_files)
          for p in sound_files+[src/"PINBALL.mp3"]:
              assert p.is_file()
              assert (dst/p.name).read_bytes()==p.read_bytes(),p.name
          print("Verified source-port audio copied bit-for-bit:",len(sound_files),"WAV files + soundtrack")
          PY
      - name: Build native standalone Android APK
        shell: bash
        run: |
          chmod +x port/gradlew
          cd port
          ./gradlew --no-daemon :app:assembleDebug --stacktrace
      - name: Verify native offline APK and original audio
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,shutil
          p=Path("port/app/build/outputs/apk/debug/app-debug.apk")
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              assert "assets/PINBALL.DAT" in names
              assert sum(x.startswith("assets/SOUND") and x.endswith(".WAV") for x in names)>=60
              assert z.getinfo("assets/PINBALL.mp3").file_size>10_000_000
              assert any(x.endswith("/libSpaceCadetPinball.so") for x in names)
              assert any(x.endswith("/libSDL2.so") for x in names)
              assert "assets/table.bmp" not in names
              assert "assets/FONT.DAT" not in names
              print("OFFLINE ORIGINAL AUDIO APK VERIFIED. File count:",len(names))
          shutil.copy2(p,"PLANET_VIKLER_ORIGINAL_AUDIO_OFFLINE.apk")
          PY
          "$ANDROID_SDK_ROOT/build-tools/33.0.2/aapt" dump badging PLANET_VIKLER_ORIGINAL_AUDIO_OFFLINE.apk > apk_badging.txt
          head -6 apk_badging.txt
          ! "$ANDROID_SDK_ROOT/build-tools/33.0.2/aapt" dump permissions PLANET_VIKLER_ORIGINAL_AUDIO_OFFLINE.apk | grep -q android.permission.INTERNET
      - uses: actions/upload-artifact@v4
        with:
          name: Planet-Vikler-Original-Audio-Offline
          path: PLANET_VIKLER_ORIGINAL_AUDIO_OFFLINE.apk
          retention-days: 15
